<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Auto Deploy Hub</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#0f172a;color:#e2e8f0;font-family:system-ui,sans-serif}
.wrap{max-width:900px;margin:0 auto;padding:24px}
.badges{display:flex;gap:8px;flex-wrap:wrap}.b{border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
.green{background:#14532d}.orange{background:#b45309}
h1{font-size:32px;margin:16px 0 4px}.sub{color:#94a3b8;margin:0 0 20px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:20px;margin-bottom:20px}
label{font-size:13px;color:#cbd5e1;display:block;margin:14px 0 6px}input,textarea{width:100%;background:#0f172a;border:1px solid #334155;color:#fff;border-radius:10px;padding:12px;font-size:14px}
textarea{font-family:monospace;min-height:180px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button{background:#e2e8f0;color:#111;border:0;border-radius:999px;padding:10px 18px;font-weight:700;cursor:pointer}
button.primary{background:#fff;width:100%;padding:14px;font-size:16px;margin-top:16px}
#log{white-space:pre-wrap;background:#020617;border-radius:10px;padding:12px;min-height:70px;font-size:13px;color:#bbf7d0}
small{color:#94a3b8}
</style></head><body><div class="wrap">
<div class="badges"><span class="b green">ツール自体: auto-deploy-hub</span><span class="b orange">更新対象: B-Woods-com / keiba-app</span></div>
<h1>Auto Deploy Hub</h1><p class="sub">このツールは keiba-app ではありません。keiba-app を更新するための専用ツールです。ここで編集しても、Pushするまで keiba-app は変わりません。</p>
<div class="card"><h2 style="margin:0">1. 接続設定</h2>
<div class="grid"><div><label>【entity-GitHub¦canonical_name=GitHub】 Owner</label><input id="owner" value="B-Woods-com"></div><div><label>更新対象リポジトリ</label><input id="repo" value="keiba-app"></div></div>
<div class="grid"><div><label>ブランチ</label><input id="branch" value="main"></div><div><label>【entity-GitHub¦canonical_name=GitHub】 Token (repo, workflow) — ブラウザのみで使用</label><input id="token" type="password" placeholder="ghp_..."></div></div>
<label>コミットメッセージ</label><input id="message" value="Update via Auto Deploy Hub">
<div style="margin-top:12px"><button id="test">接続テスト</button></div></div>
<div class="card"><h2 style="margin:0">2. Meta AI の成果物を貼る</h2><p class="sub">ファイル名は index.html がトップページです。</p>
<label>ファイル名</label><input id="path" value="index.html">
<label>コード</label><textarea id="code" placeholder="<!DOCTYPE html> ..."></textarea>
<button class="primary" id="send">keiba-app に Push する</button>
<small>このページはブラウザだけで動きます。トークンはサーバーに送られません。</small></div>
<div class="card"><h2 style="margin:0">結果ログ</h2><div id="log" style="margin-top:12px">待機中...</div></div>
</div><script>
const $=id=>document.getElementById(id);
$('test').onclick=async()=>{const t=$('token').value.trim();if(!t){$('log').textContent='トークンを入れてください';return;}
try{const r=await fetch('https://api.github.com/user',{headers:{Authorization:'Bearer '+t,Accept:'application/vnd.github+json'}});const j=await r.json();$('log').textContent=r.ok?'接続OK: '+(j.login||''):'接続失敗: '+(j.message||r.status);}catch(e){$('log').textContent='接続失敗: '+e.message;}};
$('send').onclick=async()=>{
const token=$('token').value.trim(),owner=$('owner').value.trim(),repo=$('repo').value.trim(),branch=$('branch').value.trim(),path=$('path').value.trim(),message=$('message').value.trim(),code=$('code').value;
if(!token||!code){$('log').textContent='トークンとコードを入れてください';return;}
$('send').disabled=true;$('log').textContent='送信中...';
try{const base='https://api.github.com/repos/'+owner+'/'+repo+'/contents/'+encodeURIComponent(path);let sha=null;
const g=await fetch(base+'?ref='+branch,{headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json'}});if(g.ok){const j=await g.json();sha=j.sha;}
const body={message:message,branch:branch,content:btoa(unescape(encodeURIComponent(code)))};if(sha)body.sha=sha;
const res=await fetch(base,{method:'PUT',headers:{Authorization:'Bearer '+token,Accept:'application/vnd.github+json','Content-Type':'application/json'},body:JSON.stringify(body)});
const j=await res.json();if(!res.ok)throw new Error(j.message||('HTTP '+res.status));
$('log').textContent='成功！\n'+(j.commit&&j.commit.html_url||'')+'\n\n確認URL:\nhttps://keiba-app-nu.vercel.app';
}catch(e){$('log').textContent='失敗: '+e.message;}$('send').disabled=false;};
</script></body></html>
